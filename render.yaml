services:
  - type: web
    name: gmaps-leadgen-kodekiri
    runtime: node
    plan: free
    rootDir: web-dashboard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ADMIN_PASSWORD
        value: password123
